<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greenroom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2322c55e' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4.2' fill='%2322c55e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/" aria-label="Greenroom home">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="9" stroke="#22c55e" stroke-width="2" opacity="0.9"/><circle cx="16" cy="16" r="4.2" fill="#22c55e"/><path d="M16 2.5a13.5 13.5 0 0 1 11.7 6.75" stroke="#22c55e" stroke-width="1.25" stroke-linecap="round" opacity="0.55"/><path d="M16 29.5A13.5 13.5 0 0 1 4.3 22.75" stroke="#22c55e" stroke-width="1.25" stroke-linecap="round" opacity="0.55"/></svg>
      Greenroom
    </a>
    <nav class="topnav" id="topnav" aria-label="Sections"><a href="#/" data-nav="envs">Environments</a><a href="#/brands" data-nav="brands">Brands</a></nav>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <div class="spacer"></div>
    <span class="clock" id="clock" aria-label="Current time"></span>
    <button class="btn icon ghost" id="btn-theme" title="Switch theme" aria-label="Switch theme"></button>
    <button class="btn ghost small" id="btn-reload" title="Re-read environment and seed files from disk"></button>
    <form method="post" action="/logout" id="logout-form" hidden><button class="btn ghost small" type="submit" id="btn-logout"></button></form>
  </div>
</header>
<main id="app" class="container">
  <div class="spotlight"></div>
</main>
<div id="modal-root"></div>
<div id="toasts"></div>
<script src="/assets/app.js"></script>
</body>
</html>
