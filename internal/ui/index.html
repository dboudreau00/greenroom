<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greenroom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2322c55e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230b1220'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><span class="dot"></span>Greenroom</a>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="spacer"></div>
  <span class="muted small" id="clock"></span>
  <button class="btn ghost small" id="btn-reload" title="Re-read environment and seed files from disk">Reload config</button>
  <form method="post" action="/logout" id="logout-form" hidden><button class="btn ghost small" type="submit">Sign out</button></form>
</header>
<main id="app" class="container">
  <div class="empty">Loading</div>
</main>
<div id="modal-root"></div>
<div id="toasts"></div>
<script src="/assets/app.js"></script>
</body>
</html>
