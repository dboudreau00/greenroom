name: {{envSlug}}

services:
  db:
    image: postgres:16-alpine
    container_name: {{envSlug}}-db
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "{{dbPort}}:5432"
    volumes:
      - {{envSlug}}-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: {{envSlug}}-cache
    ports:
      - "{{cachePort}}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: {{envSlug}}-web
    ports:
      - "{{webPort}}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  {{envSlug}}-pgdata:
    name: {{envSlug}}-pgdata
