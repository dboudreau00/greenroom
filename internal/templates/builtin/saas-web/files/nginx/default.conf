server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Brand assets live inside the container, outside the read-only site
  # mount, so seed steps can swap them per prospect.
  location /brand/ {
    alias /srv/brand/;
    add_header Cache-Control "no-store";
  }
}
