<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="/brand/brand.css">
<style>
:root { --brand: #22c55e; --brand-accent: #15803d; }
body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: grid; place-items: center; min-height: 100vh; margin: 0; }
main { text-align: center; max-width: 640px; padding: 24px; }
.logo { width: 88px; height: 88px; object-fit: contain; background: #fff; border-radius: 18px; padding: 10px; box-sizing: border-box; border: 3px solid var(--brand); }
h1 { font-size: 40px; margin: 18px 0 8px; }
p { color: #94a3b8; }
.for { color: var(--brand); font-weight: 600; }
.modules { margin-top: 24px; color: var(--brand-accent); font-weight: 600; }
</style>
</head>
<body>
<main>
<img class="logo" id="logo" src="/brand/logo.svg" alt="">
<h1>{{title}}</h1>
<p class="for" id="brand-name"></p>
<p id="brand-tagline">Static front end served by nginx. Greenroom probes this page before every call.</p>
<p class="modules">{{modules}}</p>
</main>
<script>
// Brand values are written to /brand/ by the reset; textContent keeps them inert.
fetch('/brand/brand.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (b) {
  if (!b) return;
  document.getElementById('logo').src = '/brand/' + (b.logo || 'logo.svg');
  document.getElementById('logo').alt = b.name || '';
  document.getElementById('brand-name').textContent = b.name ? 'Prepared for ' + b.name : '';
  if (b.tagline) document.getElementById('brand-tagline').textContent = b.tagline;
}).catch(function () {});
</script>
</body>
</html>
